<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manufacturing Manual Assistant</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <form id="csrfTokenForm" hidden>
        {% csrf_token %}
    </form>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">⚙️ Manufacturing Manual Assistant</span>
            <span class="text-white-50">Maintenance Assistant</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4">
            <!-- Maintenance Query Section -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">🔧 Maintenance Query Console</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="machineSelect" class="form-label">Select Machine</label>
                            <select id="machineSelect" class="form-select">
                                <option value="">Loading machines...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="queryInput" class="form-label">Maintenance Question</label>
                            <textarea id="queryInput" class="form-control" rows="3" placeholder="e.g., What does E17 mean? Or what is the operating pressure?"></textarea>
                        </div>
                        <button onclick="submitQuery()" class="btn btn-primary w-100">Ask Assistant</button>
                        
                        <hr class="my-4">
                        <h6>Response & Citations:</h6>
                        <div id="queryResult" class="p-3 bg-white border rounded min-vh-25">
                            <span class="text-muted">Awaiting query submission...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Administrator / Supervisor Info & Manuals Section -->
            <div class="col-lg-6">
                <div class="card shadow-sm h-100 mb-4">
                    <div class="card-header bg-secondary text-white">
                        <h5 class="mb-0">📂 Available Manuals for Selected Machine</h5>
                    </div>
                    <div class="card-body">
                        <div id="availableManuals">
                            <span class="text-muted">Select a machine to see its manuals</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript for Dynamic API Interaction -->
    <script>
        // Load machines into the dropdown on page load
        async function loadMachines() {
            try {
                const response = await fetch('/api/machines/', {
                    credentials: 'same-origin'
                });
                if (!response.ok) {
                    throw new Error(`Request failed (${response.status}).`);
                }
                const machines = await response.json();
                const select = document.getElementById('machineSelect');
                select.replaceChildren(new Option('Select a machine...', ''));
                machines.forEach(machine => {
                    const label = `${machine.name} (${machine.machine_id})`;
                    const description = machine.description
                        ? ` - ${machine.description}`
                        : '';
                    select.add(new Option(
                        `${label}${description}`,
                        machine.machine_id
                    ));
                });
            } catch (err) {
                console.error('Failed to load machines:', err);
                document.getElementById('machineSelect').replaceChildren(
                    new Option('Failed to load machines', '')
                );
            }
        }

        // Load manuals associated with the selected machine
        async function loadManualsForMachine() {
            const machineId = document.getElementById('machineSelect').value;
            const manualListDiv = document.getElementById('availableManuals');
            
            if (!machineId) {
                showMessage(
                    manualListDiv,
                    'Select a machine to see its manuals.'
                );
                return;
            }

            try {
                const response = await fetch(
                    `/api/manuals/?machine_id=${encodeURIComponent(machineId)}`,
                    { credentials: 'same-origin' }
                );
                if (!response.ok) {
                    throw new Error(`Request failed (${response.status}).`);
                }
                const manuals = await response.json();
                if (manuals.length === 0) {
                    showMessage(
                        manualListDiv,
                        'No manuals uploaded for this machine yet.',
                        'text-warning'
                    );
                    return;
                }
                const list = document.createElement('ul');
                list.className = 'list-group';
                manuals.forEach(manual => {
                    const item = document.createElement('li');
                    item.className =
                        'list-group-item d-flex justify-content-between align-items-center';
                    const title = document.createElement('span');
                    title.textContent = manual.title;
                    const revision = document.createElement('span');
                    revision.className = 'badge bg-secondary';
                    revision.textContent = `Rev: ${manual.revision}`;
                    item.append(title, revision);
                    list.append(item);
                });
                manualListDiv.replaceChildren(list);
            } catch (err) {
                showMessage(
                    manualListDiv,
                    err.message || 'Failed to load manuals.',
                    'text-danger'
                );
            }
        }

        function showMessage(container, message, className = 'text-muted') {
            const element = document.createElement('span');
            element.className = className;
            element.textContent = message;
            container.replaceChildren(element);
        }

        function renderQueryResult(data, resultDiv) {
            const fragment = document.createDocumentFragment();
            const answer = document.createElement('p');
            answer.className = 'mb-2';
            const answerLabel = document.createElement('strong');
            answerLabel.textContent = 'Answer: ';
            answer.append(answerLabel, document.createTextNode(data.answer || ''));
            fragment.append(answer);

            const status = document.createElement('p');
            status.className = 'mb-1';
            const statusLabel = document.createElement('strong');
            statusLabel.textContent = 'Status: ';
            const statusBadge = document.createElement('span');
            statusBadge.className =
                `badge bg-${data.status === 'Answered' ? 'success' : 'warning'}`;
            statusBadge.textContent = data.status || 'Unknown';
            status.append(statusLabel, statusBadge);
            fragment.append(status);

            const citationsLabel = document.createElement('strong');
            citationsLabel.textContent = 'Citations:';
            fragment.append(citationsLabel);
            const citations = document.createElement('ul');
            citations.className = 'mt-2 mb-0 ps-3';
            (Array.isArray(data.sources) ? data.sources : []).forEach(source => {
                const item = document.createElement('li');
                const detail = document.createElement('small');
                detail.className = 'text-muted';
                detail.textContent =
                    `${source.document || 'Manual'} (Rev: ${source.revision || 'N/A'}) - Page ${source.page_number || 'N/A'}`;
                item.append(detail);
                citations.append(item);
            });
            fragment.append(citations);
            resultDiv.replaceChildren(fragment);
        }

        document.getElementById('machineSelect').addEventListener('change', loadManualsForMachine);
        document.addEventListener('DOMContentLoaded', loadMachines);

        async function submitQuery() {
            const machineId = document.getElementById('machineSelect').value;
            const query = document.getElementById('queryInput').value.trim();
            const resultDiv = document.getElementById('queryResult');

            if (!machineId) {
                alert('Please select a machine first.');
                return;
            }
            if (!query.trim()) {
                alert('Please enter a query.');
                return;
            }

            showMessage(
                resultDiv,
                'Querying isolated manual embeddings...',
                'text-info'
            );

            try {
                const csrfToken = document.querySelector(
                    '#csrfTokenForm [name=csrfmiddlewaretoken]'
                ).value;
                const response = await fetch('/api/query-manual/', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ machine_id: machineId, query: query })
                });

                const data = await response.json();
                if (response.ok) {
                    renderQueryResult(data, resultDiv);
                } else {
                    showMessage(
                        resultDiv,
                        data.error || JSON.stringify(data),
                        'text-danger'
                    );
                }
            } catch (err) {
                showMessage(
                    resultDiv,
                    `Network error: ${err.message}`,
                    'text-danger'
                );
            }
        }
    </script>
</body>
</html>
